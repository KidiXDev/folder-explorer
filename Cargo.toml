[package]
name = "folder-explorer"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A fast file explorer that shows the real size of every folder"
license = "MIT"
keywords = ["explorer", "disk-usage", "folder-size", "slint"]
categories = ["filesystem", "gui"]

[dependencies]
md-5 = "0.10"
mimalloc = { version = "0.1", default-features = false }
rayon = "1.12"
sha1 = "0.10"
sha2 = "0.10"
slint = "1.18"
windows = { version = "0.62", features = [
    "Win32_Graphics_Gdi",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Time",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
