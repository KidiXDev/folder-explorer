  <!-- Pocket top highlight -->
  <path d="M23 37h18a5 5 0 0 1 4.9 4H18.1A5 5 0 0 1 23 37Z" fill="#7fd4ff" fill-opacity="0.45"/>

  <!-- Distinctive Folder Explorer size-usage meter bar inside the blue pocket -->
  <rect x="23" y="45" width="18" height="3.6" rx="1.8" fill="#003e73" fill-opacity="0.65"/>
  <rect x="23" y="45" width="11.5" height="3.6" rx="1.8" fill="#b8ebff"/>
