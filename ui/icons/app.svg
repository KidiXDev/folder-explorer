<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tab" x1="18" y1="8" x2="18" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e89c00"/>
      <stop offset="1" stop-color="#b56d00"/>
    </linearGradient>
    <linearGradient id="body" x1="32" y1="15" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe885"/>
      <stop offset="0.45" stop-color="#ffce3d"/>
      <stop offset="1" stop-color="#eca000"/>
    </linearGradient>
    <linearGradient id="bevel" x1="5" y1="18" x2="59" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff6be" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffe270" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="clip" x1="32" y1="36" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36b2ff"/>
      <stop offset="0.55" stop-color="#0078d4"/>
      <stop offset="1" stop-color="#00569c"/>
    </linearGradient>
  </defs>

  <!-- Back amber tab (top-left) -->
  <path d="M5 14.5A5.5 5.5 0 0 1 10.5 9h12.8c1.8 0 3.5.8 4.6 2.2l3.4 4.3H53.5A5.5 5.5 0 0 1 59 21v29.5a5.5 5.5 0 0 1-5.5 5.5h-43A5.5 5.5 0 0 1 5 50.5V14.5Z" fill="url(#tab)"/>

  <!-- Front golden folder body with Windows 11 stepped top edge -->
  <path d="M5 22.5A3.5 3.5 0 0 1 8.5 19h13.7c1.6 0 3.1-.6 4.2-1.7l1.9-1.8c1.1-1 2.6-1.5 4.1-1.5h21.1A5.5 5.5 0 0 1 59 19.5v31a5.5 5.5 0 0 1-5.5 5.5h-43A5.5 5.5 0 0 1 5 50.5v-28Z" fill="url(#body)"/>

  <!-- Top specular bevel along the folder fold -->
  <path d="M6.5 21h15.7c1.6 0 3.1-.6 4.2-1.7l1.9-1.8c1.1-1 2.6-1.5 4.1-1.5h21.1c2 0 3.7 1.1 4.5 2.7A5.4 5.4 0 0 0 53.5 16H32.4c-1.5 0-3 .5-4.1 1.5l-1.9 1.8c-1.1 1.1-2.6 1.7-4.2 1.7H8.5c-.8 0-1.5.2-2 .5Z" fill="url(#bevel)"/>

  <!-- Subtle shadow behind the bottom blue pocket -->
